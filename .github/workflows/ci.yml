name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm test

  # Mutation check: the suite must actually fail when the tool is wrong.
  #
  # This is the project's own thesis applied to itself. Every assertion in
  # test/ passes today; that alone proves nothing, so each mutation below
  # breaks one real behaviour and the run fails if the suite does not notice.
  # Mutation 1 is the exact trap documented in charlieanna/autocode#299 —
  # treating a load error as proof.
  #
  # A mutation that does not APPLY is also a failure, and that is not
  # pedantry. Mutation 3 used to target `if (junitXml) {`, which was renamed
  # to `hasReport` when classify() learned to accept parsed cases. The sed
  # then matched nothing for four pull requests: the source was untouched, the
  # suite passed, and the job reported "survived" — red for the wrong reason
  # while silently checking nothing at all. A mutation harness that decays
  # quietly as the code moves is worse than none, because it is trusted.
  mutation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Breaking the tool must turn the suite red
        run: |
          set -euo pipefail
          mkdir -p /tmp/pristine && cp src/*.js /tmp/pristine/
          restore() { cp /tmp/pristine/*.js src/; }

          expect_failure() {
            local label="$1" file="$2"
            if cmp -s "$file" "/tmp/pristine/$(basename "$file")"; then
              echo "::error::Mutation did not apply: $label"
              echo "The pattern matched nothing, so this mutation tested nothing."
              echo "It needs updating to the current source — a mutation that"
              echo "quietly stops applying is a check that quietly stops checking."
              restore; exit 1
            fi
            if npm test >/tmp/out 2>&1; then
              echo "::error::Mutation survived: $label"
              echo "The test suite passed against deliberately broken code, so it"
              echo "is not testing what it claims to test."
              restore; exit 1
            fi
            echo "  caught: $label"
            restore
          }

          # 1. load errors treated as strong proof
          sed -i "s|OUTCOME.INCONCLUSIVE, 'load-error'|OUTCOME.RED, 'load-error'|g" src/classify.js
          expect_failure "load-error reported as proof" src/classify.js

          # 2. the empty-collection guard removed
          perl -0pi -e "s/if \(\/no tests ran.*?\n    \}\n//s" src/classify.js
          expect_failure "exit-0-with-no-tests reported as a pass" src/classify.js

          # 3. structured evidence ignored in favour of output heuristics
          sed -i "s|  if (hasReport) {|  if (false) {|" src/classify.js
          expect_failure "structured evidence ignored" src/classify.js

          # 4. node:test's unattributable file failure read as a real one.
          #    This is the bug that reported "Proven" for a test that never
          #    executed, so it is the single most important line to pin.
          perl -0pi -e "s/\n *if \(neverRan\(.*?\n//s" src/junit.js
          expect_failure "node:test import failure read as proof" src/junit.js

          # 5. dependency drift blamed with no evidence for it
          sed -i 's|  return dependencyDiff.some((l) => re.test(l));|  return true;|' src/diagnose.js
          expect_failure "drift blamed without evidence" src/diagnose.js

          # 6. rspec reports a missing method and a failed expectation with
          #    the SAME status. Reading the first as proof is this runner's
          #    version of the node:test bug.
          sed -i 's|function isMissingCode(exception) {|function isMissingCode(exception) { return false;|' src/rspec.js
          expect_failure "rspec missing code read as a real failure" src/rspec.js

          # 7. the other direction: a nil crash IS the old behaviour, and
          #    calling it "could not run" throws away a true finding.
          perl -0pi -e "s/\n  if \(\/\\\\bfor \(\?:nil.*?\n/\n/s" src/rspec.js
          expect_failure "rspec nil crash misread as missing code" src/rspec.js

          # 8. a sampled test treated as if it were seeded. Measured on a
          #    real Qiskit assertion, an unseeded shot-based test held 31.8%
          #    of 400 runs — so this one line decides whether the verdict is
          #    evidence or a coin toss.
          sed -i 's|  const seeded = addedTestLines.some((l) => SEEDING_CALLS.some((re) => re.test(l)));|  const seeded = true;|' src/nondeterminism.js
          expect_failure "sampled test treated as seeded" src/nondeterminism.js

          # 9. the other direction: flagging ordinary deterministic tests. A
          #    warning that fires everywhere is a warning nobody reads.
          sed -i "s|  if (signals.length === 0) return { risk: 'none', signals: \[\], frameworks };||" src/nondeterminism.js
          expect_failure "ordinary tests flagged as sampling" src/nondeterminism.js

          # 10. the bundler-rewritten TypeError no longer names its symbol.
          #     Without this, vitest reports a test that never executed as
          #     "✅ Proven" — the worst error this tool can make, in one of
          #     the most widely used JS runners.
          perl -0pi -e "s|    /\\\\b\(\\\\w\+\)\\\\\)\? is not a function/g,.*?\n||s" src/diagnose.js
          expect_failure "bundler TypeError no longer names the symbol" src/diagnose.js

          # 11. a C-family method declaration going unrecognised, which made
          #     Maven blame a missing dependency for a method the PR added.
          sed -i 's|  if (addedSourceLines.some((l) => declares.test(l))) return true;|  if (addedSourceLines.some((l) => declares.test(l))) return true; return false;|' src/diagnose.js
          expect_failure "C-family declaration not recognised" src/diagnose.js

          echo "All mutations applied and were caught."

      - name: Working tree restored
        run: git diff --exit-code
