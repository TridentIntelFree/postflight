name: postflight
description: Prove a pull request's new tests actually fail without its fix.
author: TridentIntelFree

branding:
  icon: check-square
  color: red

inputs:
  test-command:
    description: |
      Command that runs the given test files. `{files}` is replaced with the
      space-separated list of test files the pull request touched.

        npx jest {files}
        pytest {files}
        go test ./...
        ./gradlew test --tests {files}

      If `{files}` is absent the command runs as-is, which is fine for runners
      that cannot be scoped to a file list — just slower.

      Optional. Left unset, the runner is detected from the repository
      (package.json, pyproject.toml, go.mod, Cargo.toml, build.gradle,
      pom.xml, Gemfile) and told to emit a JUnit report where it can, which is
      the difference between reading the result and guessing at it. Setting it
      yourself always wins; detection only fills the gap, and says plainly
      when it cannot.
    required: false
    default: ''

  test-pattern:
    description: |
      Globs identifying test files, one per line. Defaults cover the common
      conventions across JS, Python, Go, Java/Kotlin, Ruby and Rust.
    required: false
    default: ''

  setup-command:
    description: |
      Run inside the base worktree before the tests, for dependency install.
      Often unnecessary: see `link-paths`, which reuses what the job already
      installed instead of installing it twice.
    required: false
    default: ''

  link-paths:
    description: |
      Paths symlinked from the checkout into the base worktree, one per line,
      so an already-installed dependency tree is reused rather than rebuilt.
      Skipped silently when a path does not exist.
    required: false
    default: |
      node_modules

  junit-paths:
    description: |
      Directories searched for JUnit XML the run produced, one per line.
      When a report is found it decides the verdict, because JUnit already
      distinguishes an assertion failure from a test that never loaded — the
      distinction this whole check turns on. Only files written during the run
      are read, so a stale report cannot be mistaken for evidence.
    required: false
    default: |
      .

  narrow:
    description: |
      Run only the test cases the pull request adds, where the runner can be
      told to (`pytest -k`, `mocha --grep`, `jest -t`, `go test -run`, and so
      on), instead of every test in the files they live in.

      On a large suite this is the difference between a check people keep and
      one they turn off. If the filter matches nothing — name patterns differ
      per runner and per project — the whole file is run instead, because a
      filter that silently missed would turn a real result into
      "inconclusive" with nobody the wiser.
    required: false
    default: 'true'

  confirmations:
    description: |
      How many times to repeat a failing base run before reporting it as
      proof. A flaky test fails on base too, and crediting that as evidence is
      the most damaging mistake this check can make — it tells you a test has
      teeth when it does not. Set 0 to skip, at the cost of trusting a single
      run. Only a proven verdict is re-run, so the cost falls on roughly a
      third of pull requests.
    required: false
    default: '1'

  base:
    description: Base ref to compare against. Defaults to the pull request's base SHA.
    required: false
    default: ''

  on-green:
    description: |
      What to do when every touched test still passes on base: `warn`
      (default), `fail`, or `pass`.

      The default is advisory, not blocking, and that is a measured choice
      rather than timidity. Across 24 real commits of an established project
      this verdict fired once, and that once was a pull request whose source
      change was pure documentation — the added test passed on base because
      nothing had changed. The verdict was accurate and blocking it would
      still have been wrong.

      Adding a test for behaviour that already works is normal and good, and
      indistinguishable from failing to test a fix without knowing intent.
      Turn this to `fail` once you have seen enough verdicts on your own
      codebase to trust it.
    required: false
    default: 'warn'

  on-inconclusive:
    description: |
      What to do when the tests cannot execute against base at all, usually
      because they reference code the pull request introduces. That is
      typically a GOOD sign — the test genuinely depends on new work — so the
      default is `pass`. Use `warn` to keep it visible.
    required: false
    default: 'pass'

  comment:
    description: |
      Post the result as a pull request comment, updating the same comment on
      re-runs rather than stacking duplicates.
    required: false
    default: 'true'

  github-token:
    description: Token used to post the pull request comment.
    required: false
    default: ${{ github.token }}

outputs:
  outcome:
    description: 'One of: red, inconclusive, green-on-base, not-applicable, error.'
    # Composite outputs are not wired up implicitly: without an explicit
    # `value` they resolve to the empty string, silently.
    value: ${{ steps.postflight.outputs.outcome }}
  tested-files:
    description: Newline-separated test files that were evaluated.
    value: ${{ steps.postflight.outputs.tested-files }}
  report:
    description: The full result as Markdown.
    value: ${{ steps.postflight.outputs.report }}

runs:
  using: composite
  steps:
    - name: postflight
      shell: bash
      id: postflight
      run: node "$GITHUB_ACTION_PATH/src/main.js"
      env:
        INPUT_TEST_COMMAND: ${{ inputs.test-command }}
        INPUT_TEST_PATTERN: ${{ inputs.test-pattern }}
        INPUT_JUNIT_PATHS: ${{ inputs.junit-paths }}
        INPUT_SETUP_COMMAND: ${{ inputs.setup-command }}
        INPUT_LINK_PATHS: ${{ inputs.link-paths }}
        INPUT_NARROW: ${{ inputs.narrow }}
        INPUT_CONFIRMATIONS: ${{ inputs.confirmations }}
        INPUT_BASE: ${{ inputs.base }}
        INPUT_ON_GREEN: ${{ inputs.on-green }}
        INPUT_ON_INCONCLUSIVE: ${{ inputs.on-inconclusive }}
        INPUT_COMMENT: ${{ inputs.comment }}
        INPUT_GITHUB_TOKEN: ${{ inputs.github-token }}
